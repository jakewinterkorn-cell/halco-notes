<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Halco Job Notes</title>
<style>
  :root { --bg:#121820; --card:#1c2533; --card2:#243044; --line:#334155; --text:#e8eef6; --muted:#93a4bb; --accent:#3d8bfd; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 -apple-system,sans-serif; }
  header { position:sticky; top:0; z-index:20; background:#1a2332; padding:calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; justify-content:space-between; align-items:center; }
  h1 { font-size:17px; margin:0; }
  .sub { color:var(--muted); font-size:12px; }
  main { padding:16px; padding-bottom:140px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; }
  .row.stack { display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  button { appearance:none; border:0; border-radius:12px; padding:14px; min-height:48px; background:var(--accent); color:#fff; font-weight:700; font-size:16px; }
  button.ghost { background:var(--card2); color:var(--text); border:1px solid var(--line); }
  button.good { background:#1f8a55; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; }
  input,select,textarea { width:100%; background:#0f1620; color:var(--text); border:1px solid var(--line); border-radius:12px; padding:14px; font:inherit; }
  textarea { min-height:90px; }
  .choice { width:100%; text-align:left; }
  .choice.on { background:#1d4a86; }
  .preview { white-space:pre-wrap; background:#0c121a; border-radius:12px; padding:14px; font-family:ui-monospace,Menlo,monospace; font-size:14px; }
  .photos { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .photos img { width:100%; height:120px; object-fit:cover; border-radius:10px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { flex:1; font-size:13px; }
  .hidden { display:none !important; }
  .chat { max-height:220px; overflow:auto; }
  .bubble { padding:10px; border-radius:12px; background:var(--card2); margin:6px 0; }
  .bubble.me { background:#1d4a86; }
  .dock { position:fixed; left:0; right:0; bottom:0; background:#152033; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; }
  .dock button { flex:1; }
  .toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#0b0; color:#042; padding:8px 14px; border-radius:999px; display:none; z-index:50; }
</style>
</head>
<body>
<header>
  <div><h1>Halco Job Notes</h1><div class="sub" id="jsFlag">Ready</div></div>
  <button class="ghost" id="resetBtn" type="button">New job</button>
</header>
<main>
  <div class="tabs">
    <button id="tabJob" type="button">Job</button>
    <button class="ghost" id="tabChat" type="button">Grok</button>
    <button class="ghost" id="tabLib" type="button">Library</button>
  </div>
  <section id="paneJob">
    <div class="card">
      <label>Type of job</label>
      <div class="row stack">
        <button class="choice ghost" data-job="service" type="button">Service</button>
        <button class="choice ghost" data-job="maintenance" type="button">Maintenance</button>
      </div>
      <div id="maintKindWrap" class="hidden">
        <label>Maintenance kind</label>
        <div class="row stack">
          <button class="choice ghost" data-kind="Maintenance" type="button">Maintenance</button>
          <button class="choice ghost" data-kind="Prepaid Maintenance" type="button">Prepaid Maintenance</button>
        </div>
      </div>
    </div>
    <div class="card">
      <label>Date</label><input id="jobDate" type="date" />
      <label>Customer last name</label><input id="lastName" />
      <label>Invoice #</label><input id="invoice" />
      <label>System / template</label><select id="systemSel"></select>
      <label>Equipment</label><input id="equipment" placeholder="Paste model from Grok if you want it on the invoice" />
    </div>
    <div class="card">
      <label>Fill-ins ( )</label><div id="fillFields"></div>
      <label>Extra job information</label><textarea id="extraNotes"></textarea>
      <label>Job photos (not nameplates)</label><input id="photoInput" type="file" accept="image/*" multiple />
      <div class="photos" id="photoGrid"></div>
      <p class="sub">Nameplate photos go in the Grok chat. I send back Model and Serial as separate copy lines for Service Titan.</p>
    </div>
    <div class="card"><div class="preview" id="preview">Pick a type, then Build.</div></div>
  </section>
  <section id="paneChat" class="hidden">
    <div class="card">
      <p class="sub" style="margin-top:0">On-phone helper only. For nameplate IDs, send the picture in the Grok chat.</p>
      <div class="chat" id="chatLog"></div>
      <textarea id="chatIn"></textarea>
      <div class="row">
        <button type="button" id="chatSend">Ask helper</button>
        <button class="ghost" type="button" id="packPrompt">Copy Grok prompt</button>
      </div>
      <input id="apiKey" type="password" />
    </div>
  </section>
  <section id="paneLib" class="hidden">
    <div class="card">
      <textarea id="libEdit" style="min-height:240px"></textarea>
      <div class="row">
        <button type="button" id="libSave">Save library</button>
        <button class="ghost" type="button" id="libReset">Restore defaults</button>
      </div>
    </div>
  </section>
</main>
<div class="dock">
  <button type="button" id="buildBtn">Build</button>
  <button class="good" type="button" id="copyNotesBtn">Copy</button>
  <button class="ghost" type="button" id="mailBtn">Email</button>
</div>
<div class="toast" id="toast">Copied</div>
<script src="https://raw.githack.com/jakewinterkorn-cell/halco-notes/main/templates.js"></script>
<script src="https://raw.githack.com/jakewinterkorn-cell/halco-notes/main/app.js"></script>
</body></html>
